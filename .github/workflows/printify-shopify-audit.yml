name: Printify Shopify Audit

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: printify-shopify-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    name: Audit product variants
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Compare Printify with Shopify
        id: audit
        continue-on-error: true
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          SHOPIFY_STOREFRONT_ORIGIN: https://n8forged.com
        run: node scripts/audit-printify-shopify.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: printify-shopify-audit-${{ github.run_id }}
          path: .audit/printify-shopify-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when the audit finds discrepancies
        if: steps.audit.outcome == 'failure'
        run: exit 1
