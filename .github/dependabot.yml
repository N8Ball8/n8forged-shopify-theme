version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      shopify-tooling:
        patterns:
          - "@shopify/*"
    commit-message:
      prefix: chore
